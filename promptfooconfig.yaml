# Carta Prompt Evaluation
#
# Run individual test suites (recommended):
#   promptfoo eval -c src/carta/prompts/tests/discovery/gather/promptfooconfig.yaml
#   promptfoo eval -c src/carta/prompts/tests/discovery/draft/promptfooconfig.yaml
#   promptfoo eval -c src/carta/prompts/tests/discovery/refine/promptfooconfig.yaml
#
# Or run all at once (each test runs against both prompts):
#   promptfoo eval -c promptfooconfig.yaml

description: "Carta Prompt Evaluation - All Tests"

prompts:
  - id: gather-requirements
    raw: |
      {{system_prompt}}

      {{input}}
  - id: refine-discovery
    raw: |
      {{system_prompt}}
      ## Discovery Document
      {{discovery_document}}
      ## User Feedback
      {{input}}

providers:
  # Provider for gather/draft tests (uses gather-requirements prompt)
  - id: openrouter:openai/gpt-4.1-mini
    label: gather-provider
    prompts:
      - gather-requirements

  # Provider for refine tests (uses refine-discovery prompt)
  - id: openrouter:openai/gpt-4.1-mini
    label: refine-provider
    prompts:
      - refine-discovery

defaultGrader:
  id: openrouter:anthropic/claude-haiku-4.5

tests:
  - file://src/carta/prompts/tests/discovery/gather/tests.yaml
  - file://src/carta/prompts/tests/discovery/draft/tests.yaml
  - file://src/carta/prompts/tests/discovery/refine/tests.yaml
